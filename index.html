<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callie's Cuisine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
   <header class="bg-warning text-center py-5">
   <h1 class="display-4 fw-bold">Callie's Cuisine</h1>
   <p class="lead">Delectable Delights, parked near you.</p>
   <a href="#menu" class="btn btn-dark btn-lg">See the menu</a>
</header>
<main class="container py-5">
  <section id="menu">
    <h2 class="mb-4">Menu</h2>
    <div class="row g-4">

      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h3 class="card-title h5">Hog Dog</h3>
            <p class="card-text">100% beef, served on a toasted bun.</p>
            <p class="fw-bold text-success mb-0">$7.50</p>
          </div>
        </div>
      </div>

       <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h3 class="card-title h5">Hamburger</h3>
            <p class="card-text">Thick and juicy, served on a toasted bun.</p>
            <p class="fw-bold text-success mb-0">$8.25</p>
          </div>
        </div>
      </div>

       <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h3 class="card-title h5">Cheeseburger</h3>
            <p class="card-text">100% beef with melted cheddar 
                cheese, served on a toasted bun.</p>
            <p class="fw-bold text-success mb-0">$8.75</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
